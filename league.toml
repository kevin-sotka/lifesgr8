# League rules that Yahoo does not carry, because the commissioner runs them by hand.
# Life's Gr8 has Yahoo's playoffs switched off: matchups and the playoff tree are
# set by the commish. These values are a stand-in until the real logic arrives.
# DATA, not code: change the numbers here, not in compute/.

[season]
regular_season_end_week = 13     # weeks 1-13 decide seeding

[playoffs]
teams = 8                        # top 8 make the winners bracket
start_week = 14
end_week = 17
# Seeding tiebreak after record. Placeholder until the commish's rules land.
tiebreak = "points_for"

[recaps]
# The Tuesday recap is the only generated prose on the site. Each draft arrives as a
# pull request; merging it is what publishes it. After three weeks published without
# edits, set auto_publish = true to commit recaps straight to main instead.
auto_publish = false
model = "claude-opus-5"

[purse]
# The commissioner tracks the top scores every week and pays them out at the end of
# the season. Ties at the cut are all paid: two teams tied for 4th means five in the
# money that week.
places = 4
note = "Paid out at the end of the season"
currency = "$"
# Per week, from the commissioner's 2024 payout sheet: 16 weeks x $75 came to $1,200.
place_1 = 40
place_2 = 20
place_3 = 10
place_4 = 5

# The rest of the commissioner's payouts, written down but deliberately not built yet.
# From the 2024 sheet and Kevin, September 2026:
#   regular season finish: top 3 paid
#   playoffs: top 4 paid
#   toilet bowl: $40 to the winner of the bottom eight bracket
#   highest single week score of the season: $40
#   most points for the whole season: $40
# The Purse on the site covers the weekly high scores only.
