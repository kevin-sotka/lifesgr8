# The Paddock - race definitions, silks, and track config.
# This file is DATA, not code. Adding or retiring a race is a config change.
#
# Each [[race]] becomes one lane-set on The Paddock page. `stat` names the key the
# compute layer emits per team in races.json. `direction` is "high" for races the
# leader wins by having the most, "low" for races where less is better (the horse
# still runs to the right; the ordering is simply inverted before positions are set).

[track]
# Leader-relative positioning, per CLAUDE.md. Do not change these without a reason
# you can defend to sixteen managers.
mode = "leader_relative"      # leader_relative | minmax
leader_scale = 0.90           # leader sits at 90% of the rail
position_floor = 0.08         # nobody is pinned to the gate
minmax_enabled = false        # behind a flag, not the default

[[race]]
id = "gr8_cup"
name = "The Gr8 Cup"
blurb = "Total points by started players. The only race that decides anything."
stat = "points_for"
unit = "pts"
direction = "high"
featured = true

[[race]]
id = "sackmaster"
name = "The Sackmaster Stakes"
blurb = "Sacks from the two started IDP slots. Team defense runs in The Fortress Stakes."
